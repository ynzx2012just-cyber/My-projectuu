<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YanN Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0f;--card:#17171d;--c2:#22222b;--ink:#fff;--mut:#9a9aa6;--line:#24242c;--rb:#15151b;--rt:#fff;--mb:#171722;--mt:#fff;--ok:#2ee66b;--bl:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
:root[data-theme="light"]{--bl:#e4e4ea;--bg:#fff;--card:#f2f2f5;--c2:#e6e6ec;--ink:#0b0b0f;--mut:#6b6b76;--line:#e4e4ea;--rb:#eeeef2;--rt:#0b0b0f;--mb:#0b0b0f;--mt:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Sora",system-ui,sans-serif;font-weight:500;color:var(--ink);background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid #4da3ff;outline-offset:2px}
svg{flex:none}
#app{isolation:isolate;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
.hd{display:flex;align-items:center;gap:12px;padding:14px 16px}
.hd h1{flex:1;margin:0;font-size:24px;font-weight:800}
.ib2{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;position:relative}
.ib2.bg{background:var(--card)}
.hn{flex:1;min-width:0}.hn b{display:flex;gap:6px;align-items:center;font-size:17px}.hn small{color:var(--mut);display:flex;align-items:center;gap:5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok)}
.body{flex:1;overflow:auto;padding-bottom:12px}
.aw{position:relative;display:inline-block;flex:none}
.aw .dot{position:absolute;right:0;bottom:0;border:2px solid var(--bg);width:14px;height:14px}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.vf{background:#2f80ff;color:#fff;border-radius:50%;width:16px;height:16px;display:inline-grid;place-items:center}
.bd{position:absolute;top:2px;right:2px;background:#e5322d;color:#fff;border-radius:99px;min-width:17px;height:17px;font-size:10px;display:grid;place-items:center;padding:0 4px;font-weight:800}
.nb{display:flex;align-items:center;border-top:1px solid var(--line);background:var(--bg);padding-top:6px}
.nb button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;position:relative;color:var(--mut)}
.nb .on{color:var(--ink);font-weight:800}
.nb .fab{flex:none;width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;margin:-22px 6px 0;box-shadow:0 0 0 5px var(--bg);padding:0}
.hero{margin:6px 16px 14px;border-radius:22px;padding:18px;background:linear-gradient(135deg,var(--card),var(--c2));display:flex;gap:10px;align-items:center;border:1px solid var(--line)}
.hero h2{margin:0 0 6px;font-size:21px;line-height:1.2}.hero p{margin:0 0 12px;font-size:13px;color:var(--mut)}
.hero svg.m{width:96px;height:96px}
.pill{background:var(--ink);color:var(--bg);border-radius:99px;padding:9px 16px;font-weight:800;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.mg4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px}
.mg4 button{background:var(--card);border-radius:18px;padding:14px 0 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;position:relative}
.hot{position:absolute;top:-6px;right:-3px;background:#e5322d;color:#fff;font-size:9px;font-weight:800;border-radius:6px;padding:2px 5px}
.sec{display:flex;align-items:center;padding:18px 16px 8px;font-weight:800;font-size:16px;gap:8px}
.sec button{margin-left:auto;font-size:13px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:2px}
.hs{display:flex;gap:14px;overflow:auto;padding:0 16px}
.hs button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;flex:none;width:64px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;text-align:left}
.rb{flex:1;min-width:0}.rb b{display:flex;align-items:center;gap:6px;font-size:16px}

.rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--mut)}

.bt{background:var(--c2);border-radius:12px;padding:10px 20px;font-weight:700;font-size:14px}

.me .bb{background:var(--mb);color:var(--mt)}
.bb small{font-size:11px;opacity:.6;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;margin-left:auto}
.fr{display:block;width:100%;font-size:12px;font-weight:800;opacity:.7}
.tk svg+svg{margin-left:-9px}.tk.rd{color:#2f80ff;opacity:1}
.bb.sk{background:none;padding:0;flex-direction:column;align-items:flex-end}.bb.sk small{color:var(--ink)}
.bb img{display:block;max-width:220px;width:100%;border-radius:12px}
.sq{width:150px}
.stk{width:100%}.stk img{width:100%;height:100%;display:block;object-fit:contain;border-radius:0}.gr .stk{width:78%;margin-bottom:10px}
.tsk{display:grid;place-items:center;aspect-ratio:1;border:3.5px solid var(--ink);border-radius:22px;font-weight:800;font-size:20px;padding:6px;text-align:center;word-break:break-all;color:var(--ink)}
.vn{display:flex;align-items:center;gap:8px;min-width:210px}
.vn .pbn{width:34px;height:34px;border-radius:50%;background:currentColor;display:grid;place-items:center;flex:none}
.vn .pbn svg{color:var(--rb)}.me .vn .pbn svg{color:var(--mb)}
.wv{display:flex;align-items:center;gap:2px;height:26px;flex:1}
.wv s{display:block;width:3px;background:currentColor;opacity:.35;border-radius:2px}
.pl .wv s{animation:lit .01s forwards;animation-delay:calc(var(--k)*var(--d)/22)}
@keyframes lit{to{opacity:1}}
.ty i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5;display:inline-block;animation:bl 1s infinite}
.ty i:nth-child(2){animation-delay:.15s}.ty i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.15}}
.inb{display:flex;align-items:center;gap:8px;padding:10px;border-top:1px solid var(--line)}

.rec{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line)}

.sr{display:flex;gap:14px;overflow:auto;padding:6px 16px 14px}

.pf{text-align:center;padding:8px 16px}

.sw{width:46px;height:26px;border-radius:99px;background:var(--c2);position:relative;flex:none}.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mut)}
.sw.on{background:var(--ok)}.sw.on:after{left:23px;background:#fff}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 12px}

.gr .pm{position:absolute;top:6px;right:6px;color:#f5b301}
.coin{display:inline-flex;gap:6px;align-items:center;background:var(--card);border-radius:99px;padding:6px 12px;font-weight:800;font-size:14px;color:#f5b301}
.banner{margin:4px 16px 12px;border-radius:20px;padding:18px;background:linear-gradient(135deg,var(--c2),var(--card));display:flex;align-items:center;gap:12px}
.banner h3{margin:0 0 4px;font-size:18px}.banner p{margin:0;color:var(--mut);font-size:13px}
.tap{width:200px;height:200px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:36px;font-weight:800;margin:20px auto;display:grid;place-items:center;transition:transform .05s}
.tap:active:not(:disabled){transform:scale(.94)}.tap:disabled{opacity:.3}
.cen{text-align:center;padding:16px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px 16px}
.days div{background:var(--card);border-radius:16px;padding:12px 0;text-align:center;font-size:12px;color:var(--mut);display:grid;gap:4px;justify-items:center}

.rk{display:flex;align-items:center;gap:12px;padding:12px 16px}.rk>b:first-child{width:28px;text-align:center;font-size:18px}
.rk.me{background:var(--card)}
.em{padding:40px 24px;text-align:center;color:var(--mut)}
.note{margin:6px 16px;background:var(--card);border-radius:14px;padding:14px;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mut)}
.lg{flex:1;overflow:auto;padding:56px 28px 28px;text-align:center}
.logo{font-size:64px;font-weight:800;font-style:italic;letter-spacing:-4px;line-height:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.lg h1{margin:12px 0 0;font-size:30px;font-weight:800}.lg p{font-size:18px;margin:10px 0 24px;color:var(--mut)}
.fi{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:12px;text-align:left;background:var(--card)}
.or{display:flex;align-items:center;gap:12px;margin:16px 0;font-size:14px;color:var(--mut)}.or hr{flex:1;border:0;border-top:1px solid var(--line)}
.lg small{display:block;margin-top:22px;font-size:11px;color:var(--mut)}
.spl{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center;background:#000;color:#fff}
.spl .logo{font-size:96px}.spl h1{margin:6px 0 0;font-size:34px;font-weight:800;font-style:italic}.spl p{margin:0 0 90px}
.pbar{width:min(86%,340px);height:10px;border-radius:99px;background:#2a2a2a;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:#fff;border-radius:99px}

.faq{padding:14px 16px;border-bottom:1px solid var(--line)}.faq b{display:block;margin-bottom:4px}.faq span{color:var(--mut);font-size:14px}

:root[data-theme="light"] #app::before{display:none}
.hh{display:flex;align-items:center;gap:12px;padding:16px 16px 10px}
.lgo{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:flex-start;padding-top:10px}

.stt2{display:flex;gap:7px;align-items:center;margin-top:8px;font-size:15px;font-weight:600}

.hsr{flex:none;padding-top:10px}.hsr .sa{width:76px;font-weight:600}

 r.mr.onstop=async()=>{r.st.getTracks().forEach(t=>t.stop());if(!go)return;toast("Mengirim suara...");

const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};
function chan(to){return OUT[to]||(OUT[to]=SB.channel("u:"+to).subscribe())}
async function sig(to,d){const c=chan(to);for(let i=0;i<50&&c.state!=="joined";i++)await new Promise(r=>setTimeout(r,100));c.send({type:"broadcast",event:"s",payload:{...d,from:ME.id,name:S.me.name}})}
async function mkpc(peer){hang();PC=new RTCPeerConnection(ICE);
 PC.onicecandidate=e=>e.candidate&&sig(peer,{t:"ice",c:e.candidate});
 PC.ontrack=e=>{RA=RA||new Audio();RA.srcObject=e.streams[0];RA.play().catch(()=>{})};
 PC.onconnectionstatechange=()=>{const s=PC&&PC.connectionState;if(s=="connected")callOn();else if(s=="failed"){toast("Koneksi gagal");act("cend")}};
 LS=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});LS.getTracks().forEach(t=>PC.addTrack(t,LS))}
function hang(){if(V.rec&&V.rec.mr){V.rec.mr.onstop=null;try{V.rec.mr.stop()}catch(e){}V.rec.st.getTracks().forEach(t=>t.stop())}
 if(PC){PC.onconnectionstatechange=null;PC.close();PC=null}if(LS){LS.getTracks().forEach(t=>t.stop());LS=null}if(RA)RA.srcObject=null;PEND=[]}
function callOn(){if(!V.call||V.call.on)return;clearTimeout(V.cto);V.call.on=1;V.call.s=0;V.call.st="Tersambung 0:00";R();clearInterval(V.civ);
 V.civ=setInterval(()=>{if(!V.call)return;V.call.s++;V.call.st="Tersambung "+mmss(V.call.s);const e=$("#cs");if(e)e.textContent=V.call.st},1000)}
function endLocal(){hang();clearInterval(V.civ);clearTimeout(V.cto);V.call=null;R()}
async function dial(u){if(V.call)return;V.call={n:u.n,uid:u.uid,st:"Memanggil..."};R();
 try{await mkpc(u.uid);const o=await PC.createOffer();await PC.setLocalDescription(o);sig(u.uid,{t:"offer",sdp:PC.localDescription});
  V.cto=setTimeout(()=>{if(V.call&&!V.call.on){toast("Tidak dijawab");act("cend")}},45000)}catch(e){toast("Mikrofon tidak bisa diakses");endLocal()}}
async function accept(){const c=V.call;if(!c||!c.offer)return;try{await mkpc(c.uid);await PC.setRemoteDescription(c.offer);
 for(const x of PEND)await PC.addIceCandidate(x).catch(()=>{});PEND=[];const a=await PC.createAnswer();await PC.setLocalDescription(a);
 sig(c.uid,{t:"answer",sdp:PC.localDescription});c.inc=0;c.st="Menyambung...";R()}catch(e){toast("Gagal menerima panggilan");act("cend")}}
async function onSig(d){try{
 if(d.t=="offer"){if(V.call)return sig(d.from,{t:"bye"});V.call={n:d.name,uid:d.from,inc:1,st:"Panggilan masuk",offer:d.sdp};V.cto=setTimeout(()=>{if(V.call&&V.call.inc)act("cend")},45000);R()}
 else if(d.t=="answer"&&PC&&!PC.remoteDescription){await PC.setRemoteDescription(d.sdp);for(const x of PEND)await PC.addIceCandidate(x).catch(()=>{});PEND=[]}
 else if(d.t=="ice"){if(PC&&PC.remoteDescription)await PC.addIceCandidate(d.c).catch(()=>{});else PEND.push(d.c)}
 else if(d.t=="bye"&&V.call&&V.call.uid==d.from){endLocal();toast("Panggilan berakhir")}}catch(e){}}
